spring.application.name=Course
spring.datasource.url=jdbc:mysql://localhost:3306/courses_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true
server.port=8081

#jwt
student.service.url=http://localhost:8080
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

#jobrunr
jobrunr.background-job-server.enabled=true
jobrunr.dashboard.enabled=true
jobrunr.dashboard.port=8082

#kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=course-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

#elide
elide.json-api.enabled=true
elide.json-api.path=/api/v1
elide.graphql.enabled=true
elide.graphql.path=/graphql

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
