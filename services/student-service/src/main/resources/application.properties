spring.application.name=Students
spring.datasource.url=jdbc:mysql://localhost:3306/student_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

course.service.url=http://localhost:8081

#jwt
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Demo credentials are supplied through environment variables.
demo.student.username=${DEMO_STUDENT_USERNAME:student-user}
demo.student.password=${DEMO_STUDENT_PASSWORD}
demo.admin.username=${DEMO_ADMIN_USERNAME:AdminDua}
demo.admin.password=${DEMO_ADMIN_PASSWORD}

#kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=student-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
